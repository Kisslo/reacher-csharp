name: reacher

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: reacher
      POSTGRES_USER: reacher
      # Local-only dev password, same as appsettings.Development.json. Not a secret:
      # the port is bound to 127.0.0.1, so nothing outside this machine can reach it.
      POSTGRES_PASSWORD: reacher
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Read-only, so psql can run the dev seed from any shell (see the README).
      - ./backend/src/Reacher.Data/Seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reacher -d reacher"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/src/Reacher.Api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=reacher;Username=reacher;Password=reacher
      Database__MigrateOnStartup: "true"
      AccessGate__Enabled: ${AccessGate__Enabled:-false}
      Ingest__UseFakeCoordinator: ${Ingest__UseFakeCoordinator:-true}
      Brave__UseFake: ${Brave__UseFake:-true}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api

volumes:
  postgres-data:
