name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # If GitHub warns that an action version is outdated, bump the major number.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      # Fails if someone changed a package without committing packages.lock.json.
      - run: dotnet restore --locked-mode

      - run: dotnet format --verify-no-changes --no-restore

      - run: dotnet build --no-restore -c Release

      # Testcontainers needs Docker, which ubuntu-latest has preinstalled.
      - run: dotnet test --no-build -c Release
